name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-dry-run:
    name: Runs cargo publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        run: |
          cargo_version="$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version/{gsub(/.*= *"|".*/,""); print; exit}' Cargo.toml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ -z "$cargo_version" || "$tag_version" != "$cargo_version" ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' does not match the Cargo.toml version '$cargo_version'"
            exit 1
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Publish dry run
        run: cargo publish --dry-run

  release:
    name: Create Release
    needs: publish-dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish crate
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Create Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --draft=false \
            --generate-notes \
            --prerelease=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
