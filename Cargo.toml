[package]
name = "torproject"
version = "0.1.1"
edition = "2021"
description = "Tor Project for Rust"
categories = ["web-programming", "network-programming"]
homepage = "https://github.com/EstebanBorai/torproject"
repository = "https://github.com/EstebanBorai/torproject"
readme = "README.md"
keywords = ["tor", "torproject", "downloader", "api"]
license = "MIT OR Apache-2.0"
authors = ["Leo Borai <estebanborai@gmail.com>"]

[dependencies]
anyhow = "1.0"
dirs = "6.0"
flate2 = "1.1"
nix = { version = "0.31", default-features = false, features = ["signal"] }
reqwest = { version = "0.13", features = ["socks"] }
tar = "0.4"
tokio = { version = "1.52", features = ["full"] }
tracing = "0.1"
scraper = "0.27"
semver = "1.0"

[dev-dependencies]
serde_json = "1"
serial_test = "4.0.1"
